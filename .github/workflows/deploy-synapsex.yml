name: Deploy SynapseX

on:
  push:
    branches:
      - claude/synapsex-landing-site-yge3m1
      - claude/plugin-marketplace-ui-ux-pro-max-skm8iq
  pull_request:
    paths:
      - 'synapsex/**'
      - '.github/workflows/deploy-synapsex.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: synapsex/package-lock.json

      - name: Install
        run: npm ci
        working-directory: synapsex

      - name: Build
        run: npm run build
        working-directory: synapsex
        env:
          # GitHub Pages serves a project site from /<repo>/.
          BASE_PATH: /Rebrand-site-/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: synapsex/dist

  # Only pushes publish; pull_request runs stop after build so the PR still
  # gets a green check without overwriting the live site.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
